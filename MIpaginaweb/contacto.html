<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contacto rápido con Gianpierre Tezen.">
    <title>Contacto Rápido | Gianpierre Tezen</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-viewport">
        
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="profile-avatar"><i class="fa-solid fa-paper-plane"></i></div>
                <h1 class="profile-name">Gianpierre Tezen</h1>
                <p class="profile-role">Estudiante de ATI</p>
            </div>
            
            <nav class="sidebar-nav">
                <a href="index.html"><i class="fa-solid fa-house"></i> Inicio</a>
                <a href="sobre.html"><i class="fa-solid fa-address-card"></i> Sobre mí</a>
                <a href="proyectos.html"><i class="fa-solid fa-laptop-code"></i> Proyectos</a>
                <a href="galeria.html"><i class="fa-solid fa-images"></i> Galería</a>
                <a href="contacto.html" class="active"><i class="fa-solid fa-envelope"></i> Contacto</a>
            </nav>

            <div class="sidebar-footer">
                &copy; 2026 Gianpierre Tezen
            </div>
        </aside>

        <main class="content-area">
            
            <section class="section-card">
                <h2>Escríbeme Directamente</h2>
                <p class="subtitulo">Envía un mensaje rápido a través del siguiente formulario y me pondré en contacto contigo a la brevedad:</p>

                <!-- CONTENEDOR PARA EL MENSAJE DE ÉXITO O ERROR -->
                <div id="mensajeEstado" style="margin-bottom: 20px; display: none;"></div>

                <form id="formRapido" action="https://api.web3forms.com/submit" method="POST">
                    <input type="hidden" name="access_key" value="021f3ccd-b52b-4cdf-b159-edd0750fe135">
                    <input type="hidden" name="subject" value="Nuevo mensaje desde la pagina de Gianpierre Tezen Fernandez">

                    <fieldset>
                        <legend><i class="fa-solid fa-bolt"></i> Formulario Rápido</legend>

                        <div class="form-group">
                            <label for="nombre" class="required">Tu Nombre:</label>
                            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                        </div>

                        <div class="form-group">
                            <label for="email" class="required">Tu Correo Electrónico:</label>
                            <input type="email" id="email" name="email" placeholder="ati61302477@istrfa.edu.pe" required>
                        </div>

                        <div class="form-group">
                            <label for="mensaje" class="required">Mensaje:</label>
                            <textarea id="mensaje" name="mensaje" rows="6" placeholder="Escribe tu mensaje..." required></textarea>
                        </div>
                    </fieldset>

                    <button type="submit" class="btn" style="width: 100%; justify-content: center;"><i class="fa-solid fa-paper-plane"></i> Enviar Mensaje Directo</button>
                </form>

                <div class="btn-group">
                    <a href="contacto2.html" class="btn btn-secondary"><i class="fa-solid fa-list-check"></i> Ver Formulario Detallado</a>
                    <a href="index.html" class="btn btn-secondary"><i class="fa-solid fa-house"></i> Volver al Inicio</a>
                </div>
            </section>

        </main>

    </div>

    <!-- SCRIPT PARA ENVÍO EN SEGUNDO PLANO SIN REDIRECCIÓN -->
    <script>
        const form = document.getElementById('formRapido');
        const mensajeEstado = document.getElementById('mensajeEstado');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            mensajeEstado.style.display = 'block';
            mensajeEstado.innerHTML = "<p style='color: var(--color-secondary); font-weight: bold;'>Enviando mensaje...</p>";

            const formData = new FormData(form);

            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                body: formData
            })
            .then(async (response) => {
                let json = await response.json();
                if (response.status === 200) {
                    mensajeEstado.innerHTML = "<p style='color: #15803D; font-weight: bold; background: #DCFCE7; padding: 14px; border-radius: 12px; border: 1px solid #86EFAC;'><i class='fa-solid fa-circle-check'></i> ¡Mensaje enviado con éxito! Me pondré en contacto contigo pronto.</p>";
                    form.reset();
                } else {
                    mensajeEstado.innerHTML = `<p style='color: #B45309; background: #FEF3C7; padding: 14px; border-radius: 12px;'><i class='fa-solid fa-triangle-exclamation'></i> ${json.message}</p>`;
                }
            })
            .catch(error => {
                mensajeEstado.innerHTML = "<p style='color: #EF4444; background: #FEE2E2; padding: 14px; border-radius: 12px;'><i class='fa-solid fa-circle-xmark'></i> Ocurrió un error al enviar el mensaje. Intenta nuevamente.</p>";
            });
        });
    </script>

</body>
</html>
