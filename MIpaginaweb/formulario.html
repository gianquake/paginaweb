<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Implementación de Formulario</title>
    <style>
        /*Estilos generales y caja responsive*/
        *{
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20 px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
        }
        header {
            text-align: center;
            margin-bottom: 3px solid #004085;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        header h1 {
            color: #004085;
            margin: 0 0 5px 0;
            font-size: 1.8rem;
        }
        header p {
            margin: 0;
            color: #6c757d;
            font-size: 0.95rem;
        }

        
        fieldset {
            border: 1px solid #ced4da;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 25px;
            background-color: #fafafa;
            
        }
        legend {
            font-weight: bold;
            color: #004085;
            padding: 0 10px;
            font-size: 1.1rem;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group-inline {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .form-group-incline > div {
            flex: 1;
            min-width: 220px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }
         .required::after {
            content: " *";
            color: #dc3545;
        }

        /*estilos de entradad de texto, selects, y textarea*/
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"],
        input[type="date"],
        input[type="number"],
        input[type="file"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 0.95rem;
            transition: border-color 0.3s;
        }
    </style>
</head>
<body>

</body>
</html>
